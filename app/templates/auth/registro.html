{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-4">Crear cuenta de organizador</h1>
    <form method="post" class="bg-white p-4 rounded shadow-sm">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" value="{{ nombre or '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ email or '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label">Repetir contraseña</label>
        <input type="password" name="password_confirm" class="form-control" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
    </form>
    <p class="mt-3">¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}">Iniciá sesión</a></p>
  </div>
</div>
{% endblock %}
